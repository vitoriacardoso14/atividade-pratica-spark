resources:
  jobs:
    CineData_Pipeline_ETL:
      name: CineData_Pipeline_ETL
      trigger:
        pause_status: UNPAUSED
        periodic:
          interval: 1
          unit: DAYS
      tasks:
        - task_key: Task_Bronze
          notebook_task:
            notebook_path: /Workspace/Users/vitoria14crds@gmail.com/01_Bronze_CineData
            source: WORKSPACE
        - task_key: Task_Silver
          depends_on:
            - task_key: Task_Bronze
          notebook_task:
            notebook_path: /Workspace/Users/vitoria14crds@gmail.com/02_Silver_CineData
            source: WORKSPACE
        - task_key: Task_Gold
          depends_on:
            - task_key: Task_Silver
          notebook_task:
            notebook_path: /Workspace/Users/vitoria14crds@gmail.com/03_Gold_CineData
            source: WORKSPACE
      queue:
        enabled: true
      performance_target: PERFORMANCE_OPTIMIZED
